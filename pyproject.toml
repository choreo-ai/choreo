[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "choreoai"
version = "0.0.6.dev0"
description = "Build production-grade multi-agent AI systems — compose, orchestrate, and observe autonomous agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Karthik Reddy Basupally" }]
keywords = ["multi-agent", "agents", "llm", "orchestration", "ai-agents"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "langchain-core>=0.3",
  "langchain-anthropic>=0.3",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
langchain = ["langchain>=0.3"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "build>=1.0",
  "pylint>=3.0",
]

[project.urls]
Homepage = "https://github.com/choreo-ai/choreoai"
Repository = "https://github.com/choreo-ai/choreoai"
Issues = "https://github.com/choreo-ai/choreoai/issues"

[project.scripts]
choreo = "choreo.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/choreo"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Ensure tests/ helpers (e.g. fakes) are importable when cwd is not on sys.path
# (CI / PYTHONSAFEPATH); do not import from conftest as a package.
pythonpath = ["tests"]

