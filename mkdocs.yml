site_name: ChoreoAI
site_description: Multi-agent systems, in production. Build production-grade multi-agent AI systems — compose, orchestrate, and observe autonomous agents.
site_url: https://choreo-ai.github.io/choreoai/
repo_url: https://github.com/choreo-ai/choreoai
repo_name: choreo-ai/choreoai
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Karthik Reddy Basupally · MIT

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Space Grotesk
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference
  features:
    - announce.dismiss
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.prune
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tooltips

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/choreo-ai/choreoai
      name: choreo-ai/choreoai on GitHub

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            # Docstrings
            docstring_style: google
            docstring_section_style: table
            # Page already has H1 (`# \`module\``); skip root heading so
            # classes/functions start at h2 and methods/attrs at h3 — clearer
            # visual hierarchy and one less redundant title.
            show_root_heading: false
            show_root_full_path: true
            show_root_toc_entry: true
            # Qualified names: full dotted path on every member so symbols are
            # unambiguous, searchable, and match heading anchors / inventory ids.
            show_root_members_full_path: true
            show_object_full_path: true
            # Type pills in headings + right-hand TOC (class / meth / attr / …)
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            # Signatures
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            line_length: 88
            # Members
            merge_init_into_class: true
            filters: ["!^_"]
            members_order: source
            group_by_category: true
            show_category_heading: false
            summary: true
            show_source: true
            show_bases: true
            show_inheritance_diagram: false
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Design:
      - Overview: DESIGN.md
      - API verification: api-verification.md
  - Architecture decisions:
      - Composition over inheritance: adr/0001-composition-over-inheritance.md
      - LCEL Runnable node interface: adr/0002-lcel-runnable-node-interface.md
      - Middleware onion: adr/0003-middleware-onion.md
      - Compat-first owned value-add: adr/0004-compat-first-owned-value-add.md
      - LangGraph engine: adr/0005-langgraph-engine.md
      - RunContext in graph state: adr/0006-runcontext-in-graph-state.md
      - Typed event stream: adr/0007-typed-event-stream.md
      - Packaging optional extras: adr/0008-packaging-optional-extras.md
  - API reference: reference/
