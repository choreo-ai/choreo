# This workflow will install Python dependencies, run tests across versions
# with a single command, and report coverage. Adapted for the src/ layout
# and hatchling build used by choreo.
#
# For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Editable install with test + optional LangGraph extras.
          # Tests use fakes and must pass offline (no ANTHROPIC_API_KEY).
          pip install -e ".[dev,langgraph]"

      - name: Test with pytest
        run: |
          pytest
